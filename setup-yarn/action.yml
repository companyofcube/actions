name: "Setup Yarn"
description: "Setup Node.js and install dependencies using Yarn"
inputs:
  node-version:
    description: "The version of Node.js to use"
    required: true
  registry-token:
    description: "The token to authenticate with the CompanyOfCube registry"
    required: false
runs:
  using: "composite"
  steps:
    - name: ⚙ Enable Corepack
      shell: bash
      run: corepack enable

    - name: ⚙ Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: yarn

    - name: 🔑 Authenticate with registry
      if: ${{ inputs.registry-token != '' }}
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: yarn config set npmScopes.companyofcube.npmAuthToken "$REGISTRY_TOKEN"

    - name: 📦 Install dependencies
      shell: bash
      run: yarn install --immutable
