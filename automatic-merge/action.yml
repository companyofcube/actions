name: "Automatic merge"
description: "Automatically merge changes from the source branch to the target branch"
inputs:
  source-branch:
    description: "Source branch to merge from"
    required: false
    default: "master"
  target-branch:
    description: "Target branch to merge into"
    required: false
    default: "develop"
  repository:
    description: "Git repository URL"
    required: true
  ssh-host:
    description: "SSH host for the Git repository"
    required: true
  ssh-key:
    description: "SSH private key for pushing to the Git repository"
    required: true
  ssh-port:
    description: "SSH port for the Git repository"
    required: false
    default: "22"
  ssh-user:
    description: "SSH user for the Git repository"
    required: false
    default: "git"
  discord-webhook-url:
    description: "Discord webhook URL for notifications"
    required: false
runs:
  using: "composite"
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config user.name gitea-actions
        git config user.email teabot@gitea.io

    - name: Attempt to merge ${{ inputs.source-branch }} into ${{ inputs.target-branch }}
      id: merge
      shell: bash
      env:
        SOURCE_BRANCH: ${{ inputs.source-branch }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
      run: |
        git fetch origin "$TARGET_BRANCH"
        git checkout "$TARGET_BRANCH"
        git merge "origin/$SOURCE_BRANCH" --ff -m "Auto-merge $SOURCE_BRANCH into $TARGET_BRANCH" \
          || echo "CONFLICT=true" >> $GITHUB_OUTPUT

    - name: Push if no conflicts
      if: steps.merge.outputs.CONFLICT != 'true'
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-key }}
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_PORT: ${{ inputs.ssh-port }}
        SSH_USER: ${{ inputs.ssh-user }}
        REPOSITORY: ${{ inputs.repository }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        git remote set-url origin "ssh://$SSH_USER@$SSH_HOST:$SSH_PORT/$REPOSITORY.git"
        git push origin "HEAD:refs/heads/$TARGET_BRANCH"

    - name: Notify about conflicts
      if: steps.merge.outputs.CONFLICT == 'true'
      shell: bash
      env:
        SOURCE_BRANCH: ${{ inputs.source-branch }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
      run: |
        git merge --abort
        echo "::warning::⚠️ Merge conflict detected! Cannot automatically merge $SOURCE_BRANCH into $TARGET_BRANCH. Please resolve conflicts manually."
        exit 1

    - name: 📩🔥 Send Discord notification about conflicts
      if: failure() && inputs.discord-webhook-url != ''
      uses: companyofcube/actions/discord-notify@main
      with:
        job-status: ${{ job.status }}
        job-title: "Automatic ${{ inputs.source-branch }} → ${{ inputs.target-branch }} failed due to merge conflicts"
        webhook-url: ${{ inputs.discord-webhook-url }}
