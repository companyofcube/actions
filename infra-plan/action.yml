name: "Plan infrastructure Changes"
description: "Plan infrastructure changes before applying them"
inputs:
  environment:
    description: "Deployment environment (dev/prod). Leave empty for projects without environment-specific backends."
    required: false
    default: ""
  tofu-version:
    description: "The version of OpenTofu to use"
    required: false
    default: "1.12.3"
  working-directory:
    description: "The directory containing your infrastructure configuration files"
    required: false
    default: ".infra"
runs:
  using: "composite"
  steps:
    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v2
      with:
        tofu_version: ${{ inputs.tofu-version }}

    - name: Check format
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: tofu fmt -check

    - name: Init OpenTofu
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BACKEND_CONFIG: ${{ inputs.environment != '' && format('-backend-config=backend-{0}.hcl', inputs.environment) || '' }}
      run: tofu init $BACKEND_CONFIG

    - name: Validate infrastructure
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: tofu validate

    - name: Plan infrastructure changes
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_VAR_environment: ${{ inputs.environment }}
      run: tofu plan -input=false
